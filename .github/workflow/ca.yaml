name: ci-build-asp.net-project
on:
    workflow_dispatch:
jobs:
    build:
         runs-on: ubuntu-latest
         steps:
            - name: checkout code
               uses : actions/checkout@v3
            - name: setup dotnet
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.X'
            - name: restore deps
              run: dotnet restore /Blinkit_GHA/BlinkitGHA.slnx
            - name: build
              run: dotnet build /Blinkit_GHA/BlinkitGHA.slnx --configuration Release --no-restore
            