name: ci-build-asp.net-project
on:
    workflow_dispatch:
jobs:
    build:
         runs-on: ubuntu-latest
         steps:
            - name: checkout code
              uses : actions/checkout@v4
            - name: setup dotnet
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: '10.0.x'
            - name: restore deps
              run: dotnet restore /Blinkit_GHA/BlinkitGHA.slnx
            - name: build
              run: dotnet build /Blinkit_GHA/BlinkitGHA.slnx --configuration Release --no-restore
            